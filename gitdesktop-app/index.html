<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gitdesktop</title>
    <style>
      html, body { margin: 0; min-height: 100%; }
      html { background: #080808; }
      #startup-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: grid; place-items: center;
        background: #080808; color: #eeeeee;
        font-family: "Space Grotesk Variable", system-ui, sans-serif;
        opacity: 1; transition: opacity 180ms cubic-bezier(.33, 1, .68, 1);
      }
      #startup-splash.is-exiting { opacity: 0; pointer-events: none; }
      .startup-content { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .startup-logo { width: 56px; height: 56px; animation: startup-arrive 180ms cubic-bezier(.33, 1, .68, 1) both; }
      .startup-name { font-size: 13px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; animation: startup-arrive 180ms 60ms cubic-bezier(.33, 1, .68, 1) both; }
      .startup-track { width: 132px; height: 2px; overflow: hidden; background: rgb(238 238 238 / .1); }
      .startup-progress { width: 100%; height: 100%; background: #eeeeee; transform-origin: left; animation: startup-fill 1150ms ease-in-out both; }
      @keyframes startup-arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes startup-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        .startup-logo, .startup-name { animation: none; }
        .startup-progress { animation-timing-function: linear; }
      }
    </style>
    <script>performance.mark("gd:splash-start")</script>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="Loading GitDesktop">
      <div class="startup-content">
        <img class="startup-logo" src="/favicon.svg" alt="" />
        <span class="startup-name">GitDesktop</span>
        <div class="startup-track" aria-hidden="true"><div class="startup-progress"></div></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
